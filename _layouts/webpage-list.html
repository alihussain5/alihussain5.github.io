<!doctype html>
<html>
  {% include head.html %}
  <body>
    {% include header.html %}
    <main>
      {{ content }}
      <ul>
        {% for webpage in page.list %}
        <li><a href="{{ webpage.url }}">{{ webpage.title }}</a> by {{ webpage.author }} - {{ webpage.date | date_to_string }}</li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
