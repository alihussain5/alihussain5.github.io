<!doctype html>
<html>
  {% include head.html %}
  <body>
    {% include header.html %}
    <main>
      {{ content }}
      <ul>
        {% for post in site.posts %}
          <li><a href="{{ post.url }}">{{ post.title }}</a> - {{ post.date | date_to_string }}</li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
