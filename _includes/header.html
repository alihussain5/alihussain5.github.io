<header>
  <h2>
    {{ site.title }}
  </h2>

  {% if site.navigation %}
    <nav>
      {% for item in site.navigation %}
        <div class="nav-item-container">
          <a href="{{ item.url | relative_url }}" class="nav-item {% if page.url | relative_url == item.url | relative_url %}active{% endif %}">
            {{ item.title }}
          </a>
        </div>
      {% endfor %}
    </nav>
  {% endif %}
</header>
