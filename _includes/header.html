<header>
  <h2>
    {{ site.title }}
  </h2>

  {% if site.navigation %}
    <nav>
      {% for item in site.navigation %}
          <a href="{{ item.url | relative_url }}" class="nav-item {% if page.url == item.url %}active{% endif %}">
            {{ item.title }}
          </a>
      {% endfor %}
    </nav>
  {% endif %}
</header>
