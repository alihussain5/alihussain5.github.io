<header>
  <h2>
    {{ site.title }}
  </h2>

  {% if site.navigation %}
    <nav>
      {% for item in site.navigation %}
        {% assign current = page.url | append: '/' | replace: '//', '/' %}
        {% assign nav_item = item.url | append: '/' | replace: '//', '/' %}
        <a href="{{ item.url | relative_url }}" class="nav-item {% if current == nav_item %}active{% endif %}">
          {{ item.title }}
        </a>
      {% endfor %}
    </nav>
  {% endif %}
</header>
